# Triển khai thủ công (Actions → Deploy → Run workflow) hoặc khi đẩy tag v*.
# Cần secrets: SSH_HOST, SSH_USER, SSH_KEY, và thư mục dự án trên server (mặc định /opt/research-notes).
name: Deploy
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/research-notes
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            for i in $(seq 1 30); do curl -sf http://localhost/api/health >/dev/null && echo healthy && exit 0; sleep 2; done
            echo "health check failed" && docker compose logs --tail=60 api && exit 1
